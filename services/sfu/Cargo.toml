[package]
name = "teamspace-sfu"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = { version = "1", optional = true }
futures = "0.3"
hmac = "0.12"
interceptor = "0.17.2"
rtc = { version = "0.9.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
webrtc = "0.17.1"

[features]
rtc = ["dep:rtc", "dep:bytes"]

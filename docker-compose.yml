services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    container_name: 'teamspace-one-postgres'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'PGPASSWORD="$POSTGRES_PASSWORD" pg_isready -U "$POSTGRES_USER"' ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7-alpine'
    container_name: 'teamspace-one-redis'
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: [ 'redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ]
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG' ]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: 'nats:2-alpine'
    container_name: 'teamspace-one-nats'
    restart: unless-stopped
    environment:
      NATS_USER: ${NATS_USER:?NATS_USER is required}
      NATS_PASSWORD: ${NATS_PASSWORD:?NATS_PASSWORD is required}
    command:
      - '--js'
      - '--config'
      - '/etc/nats/nats-server.conf'
    volumes:
      - nats-data:/data/jetstream
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - '127.0.0.1:4222:4222'
      - '127.0.0.1:8222:8222'
    healthcheck:
      test: [ 'CMD', 'wget', '-qO-', 'http://localhost:8222/healthz' ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: 'minio/minio:RELEASE.2024-08-17T01-24-54Z'
    container_name: 'teamspace-one-minio'
    restart: unless-stopped
    command: [ 'server', '/data', '--console-address', ':9001' ]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: 'jaegertracing/all-in-one:1.59'
    container_name: 'teamspace-one-jaeger'
    restart: unless-stopped
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  otel-collector:
    image: 'otel/opentelemetry-collector-contrib:0.109.0'
    container_name: 'teamspace-one-otel-collector'
    restart: unless-stopped
    command: [ '--config=/etc/otel-collector.yaml' ]
    volumes:
      - ./docker/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'
    depends_on:
      - jaeger

  base:
    image: 'teamspace-one-base'
    build:
      context: .
      dockerfile: 'docker/Dockerfile.base'
    container_name: 'teamspace-one-base-builder'
    command: [ 'true' ]
    restart: 'no'

  auth-service:
    build:
      additional_contexts:
        teamspace-one-base: 'service:base'
      context: .
      dockerfile: 'services/auth/Dockerfile'
    container_name: 'teamspace-one-auth-service'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/identity_db?schema=public'
      NATS_URL: 'nats://${NATS_USER:?NATS_USER is required}:${NATS_PASSWORD:?NATS_PASSWORD is required}@nats:4222'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ORGANISATION_SERVICE_URL: 'http://organisation-service:3003'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_SERVICE_NAME: 'teamspace-one-auth-service'
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector


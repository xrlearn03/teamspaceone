services:
  postgres:
    image: postgres:16-alpine
    container_name: reactify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reactify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: reactify-nats
    restart: unless-stopped
    command:
      - "--js"
      - "--store_dir"
      - "/data/jetstream"
      - "--config"
      - "/etc/nats/nats-server.conf"
    volumes:
      - nats-data:/data/jetstream
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: reactify-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: reactify-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: reactify-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./docker/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      - jaeger

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: reactify-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-auth-service
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  organisation-service:
    build:
      context: .
      dockerfile: services/organisation/Dockerfile
    container_name: reactify-organisation-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/organisation_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-organisation-service
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    container_name: reactify-messaging-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/messaging_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-messaging-service
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  realtime-service:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    container_name: reactify-realtime-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/realtime_db?schema=public
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-realtime-service
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - nats
      - otel-collector

  projects-service:
    build:
      context: .
      dockerfile: services/projects/Dockerfile
    container_name: reactify-projects-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/project_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-projects-service
    ports:
      - "3006:3006"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  audit-service:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    container_name: reactify-audit-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/audit_db?schema=public
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-audit-service
    ports:
      - "3007:3007"
    depends_on:
      - postgres
      - nats
      - otel-collector

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: reactify-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-notification-service
    ports:
      - "3008:3008"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  meeting-service:
    build:
      context: .
      dockerfile: services/meeting/Dockerfile
    container_name: reactify-meeting-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/meeting_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-meeting-service
    ports:
      - "3009:3009"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  file-storage-service:
    build:
      context: .
      dockerfile: services/file-storage/Dockerfile
    container_name: reactify-file-storage-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/file_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/uploads
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-file-storage-service
    volumes:
      - file-uploads:/app/uploads
    ports:
      - "3010:3010"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  search-service:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    container_name: reactify-search-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3011
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/search_db?schema=public
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-search-service

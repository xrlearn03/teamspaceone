      ORGANISATION_EMAIL_ENCRYPTION_KEY: ${ORGANISATION_EMAIL_ENCRYPTION_KEY:?ORGANISATION_EMAIL_ENCRYPTION_KEY is required}
      AUTH_SERVICE_URL: 'http://auth-service:3002'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'

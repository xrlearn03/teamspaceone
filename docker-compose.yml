  ai-service:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: reactify-ai-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3012
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_db?schema=public
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-ai-service
    ports:
      - "3012:3012"
    depends_on:
      - postgres
      - nats
      - redis
      - otel-collector

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: reactify-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3002
      ORGANISATION_SERVICE_URL: http://organisation-service:3003
      MESSAGING_SERVICE_URL: http://messaging-service:3004
      REALTIME_SERVICE_URL: http://realtime-service:3005
      PROJECTS_SERVICE_URL: http://projects-service:3006
      AUDIT_SERVICE_URL: http://audit-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      MEETING_SERVICE_URL: http://meeting-service:3009
      FILE_STORAGE_SERVICE_URL: http://file-storage-service:3010
      SEARCH_SERVICE_URL: http://search-service:3011
      AI_SERVICE_URL: http://ai-service:3012
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-auth}
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: reactify-api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - organisation-service
      - messaging-service
      - realtime-service
      - projects-service
      - audit-service
      - notification-service
      - meeting-service
      - file-storage-service
      - search-service
      - ai-service
      - otel-collector

volumes:
  postgres-data:
  nats-data:
  minio-data:
  file-uploads:

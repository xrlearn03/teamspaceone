      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      NATS_URL: 'nats://${NATS_USER:?NATS_USER is required}:${NATS_PASSWORD:?NATS_PASSWORD is required}@nats:4222'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      OTEL_SERVICE_NAME: 'teamspace-one-api-gateway'
    ports:
      - '3000:3000'
    depends_on:
      - auth-service
      - organisation-service
      - messaging-service
      - realtime-service
      - projects-service
      - audit-service
      - notification-service
      - meeting-service
      - file-storage-service
      - search-service
      - ai-service
      - hrms-service
      - interview-service
      - otel-collector

  web:
    build:
      additional_contexts:
        teamspace-one-base: 'service:base'
      context: .
      dockerfile: 'apps/web/Dockerfile'
    container_name: 'teamspace-one-web'
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-teamspaceone.in}
    ports:
      - '${WEB_PORT:-8080}:80'

  desktop-next:
    build:
      additional_contexts:
        teamspace-one-base: 'service:base'
      context: .
      dockerfile: 'apps/desktop-next/Dockerfile'
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://app.teamspaceone.in}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-wss://realtime.teamspaceone.in}
        NEXT_PUBLIC_SFU_URL: ${NEXT_PUBLIC_SFU_URL:-wss://sfu.teamspaceone.in}
        NEXT_PUBLIC_ICE_SERVERS: ${NEXT_PUBLIC_ICE_SERVERS:-}
    container_name: 'teamspace-one-desktop-next'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002

volumes:
  postgres-data:
  nats-data:
  minio-data:
  sfu-recordings:

name: TeamspaceOne
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "150.0.0"
options:
  bundleIdPrefix: com.edutapxr.teamspaceone
  deploymentTarget:
    iOS: "17.0"
  usesTabs: false
  indentWidth: 2
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    INFOPLIST_KEY_UIRequiredDeviceCapabilities: [armv7, arm64]
    INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleDefault"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Teamspace One needs microphone access for voice calls."
    INFOPLIST_KEY_NSCameraUsageDescription: "Teamspace One needs camera access for video calls."
    INFOPLIST_KEY_APIBaseURL: "http://localhost:3000"
    INFOPLIST_KEY_RealtimeURL: "http://localhost:3005"
    INFOPLIST_KEY_SFUURL: "ws://127.0.0.1:8443"
    INFOPLIST_KEY_STUNURL: "stun:stun.l.google.com:19302"
    INFOPLIST_KEY_TURNURL: ""
    INFOPLIST_KEY_TURNUsername: ""
    INFOPLIST_KEY_TURNPassword: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_IDENTITY: "iPhone Developer"
    DEVELOPMENT_TEAM: "$(TEAM_ID)"
targets:
  TeamspaceOne:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    dependencies:
      - package: SocketIO
      - package: WebRTC

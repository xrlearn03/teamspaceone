name: TeamspaceOne
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "150.0.0"
options:
  bundleIdPrefix: com.edutapxr.teamspaceone
  deploymentTarget:
    iOS: "17.0"
  usesTabs: false
  indentWidth: 2
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_IDENTITY: "iPhone Developer"
    DEVELOPMENT_TEAM: "$(TEAM_ID)"
targets:
  TeamspaceOne:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    dependencies:
      - package: SocketIO
      - package: WebRTC
    entitlements:
      path: TeamspaceOne.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:app.teamspaceone.in
    info:
      path: Info.plist
      properties:
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - armv7
          - arm64
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        NSCameraUsageDescription: "Teamspace One needs camera access for video calls."
        NSMicrophoneUsageDescription: "Teamspace One needs microphone access for voice calls."
        APIBaseURL: "http://localhost:3000"
        RealtimeURL: "http://localhost:3005"
        SFUURL: "ws://127.0.0.1:8443"
        STUNURL: "stun:stun.l.google.com:19302"
        TURNURL: ""
        TURNUsername: ""
        TURNPassword: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.edutapxr.teamspaceone
            CFBundleURLSchemes:
              - teamspaceone

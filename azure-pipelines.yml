# Azure Pipelines build + deploy for the Teamspace One desktop app.
#
# Builds macOS universal and Windows (x86_64) Tauri bundles, generates the
# Tauri updater manifest, and deploys the contents of apps/web/public/downloads/
# to the GCE VM that serves the marketing site.
#
# Required secure files / pipeline variables:
#   Secure file: teamspace-one.key     # minisign private key (upload in
#                                      # Azure Pipelines > Library > Secure files)
#   Optional variables:
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  # only if the key is password-protected
#     APPLE_SIGNING_IDENTITY             # e.g. "Developer ID Application: ..."
#     APPLE_CERTIFICATE                  # base64 .p12 (optional)
#     APPLE_CERTIFICATE_PASSWORD
#     APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH
#     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#     GCP_SA_KEY_B64                     # base64 service-account JSON
#     GCP_PROJECT                        # e.g. teamspace-one
#     GCE_INSTANCE                       # e.g. teamspace-one
#     GCE_ZONE                           # e.g. asia-south1-a

trigger:
  branches:
    include:
      - main
      - master
      - hrms
  tags:
    include:
      - 'v*'

pr: none

variables:
- group: teamspace-one
- name: nodeVersion
  value: '20.x'
- name: pnpmVersion
  value: '9.15.9'
- name: CARGO_HOME
  value: '$(Pipeline.Workspace)/.cargo'
- name: PNPM_STORE_DIR
  value: '$(Pipeline.Workspace)/.pnpm-store'

stages:
  - stage: BuildDesktop
    displayName: 'Build desktop bundles'
    jobs:
      - job: macOS_universal
        displayName: 'macOS universal'
        pool:
          vmImage: 'macos-latest'
        variables:
          TAURI_TARGET: 'universal-apple-darwin'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            inputs:
              key: 'cargo | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: |
                cargo | "$(Agent.OS)" | "$(TAURI_TARGET)"
                cargo | "$(Agent.OS)"
              path: $(CARGO_HOME)
            displayName: 'Cache Cargo registry'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | $(Build.SourcesDirectory)/pnpm-lock.yaml'
              restoreKeys: pnpm | "$(Agent.OS)"
              path: $(PNPM_STORE_DIR)
            displayName: 'Cache pnpm store'

          - task: Cache@2
            inputs:
              key: 'target | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: target | "$(Agent.OS)" | "$(TAURI_TARGET)"
              path: $(Build.SourcesDirectory)/apps/desktop/src-tauri/target
            displayName: 'Cache Rust target'

          - script: |
              npm install -g pnpm@$(pnpmVersion)
              pnpm config set store-dir $(PNPM_STORE_DIR)
              rustup target add aarch64-apple-darwin x86_64-apple-darwin
            displayName: 'Install pnpm + Rust targets'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install workspace dependencies'

          - script: pnpm --filter @teamspace-one/authorization build
            displayName: 'Build authorization package'

          - script: node scripts/bump-version.mjs ci
            workingDirectory: 'apps/desktop'
            env:
              BUILD_BUILDID: $(Build.BuildId)
            displayName: 'Set CI build version'

          - task: DownloadSecureFile@1
            name: tauriKey
            inputs:
              secureFile: 'teamspace-one.key'
            displayName: 'Download updater signing key'

          - task: DownloadSecureFile@1
            name: appleCertificate
            inputs:
              secureFile: 'Certificates.p12'
            displayName: 'Download Apple signing certificate'

          - task: DownloadSecureFile@1
            name: appleApiKey
            inputs:
              secureFile: 'AuthKey_M2U388NVSS.p8'
            displayName: 'Download Apple notarization API key'

          - script: |
              set -e
              if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ ! -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
                echo "TAURI_SIGNING_PRIVATE_KEY secure file not found at $TAURI_SIGNING_PRIVATE_KEY. Upload teamspace-one.key to Azure Pipelines > Library > Secure files." >&2
                exit 1
              fi

              # Optional password for the private key. Keys generated with `tauri signer generate --ci`
              # use an empty password, but Tauri still needs the env var to be set (even to an empty
              # string) to avoid an interactive prompt. Guard against the literal Azure macro.
              if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || [ "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:0:1}" = '$' ]; then
                export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
              fi

              # Only expose macOS signing variables to Tauri when they are actually
              # defined. Azure leaves the macro literal (e.g. $(APPLE_CERTIFICATE)) when
              # a variable is missing, and Tauri then tries to base64-decode that literal
              # and fails with "Invalid symbol 36".
              exportVars() {
                local name=$1 raw=$2
                # A valid base64 cert/identity never starts with "$". Azure leaves the
                # macro literal "$(VAR)" when a variable is undefined, so skip those.
                if [ -n "$raw" ] && [ "${raw:0:1}" != '$' ]; then
                  export "$name=$raw"
                fi
              }
              exportVars APPLE_SIGNING_IDENTITY "$_APPLE_SIGNING_IDENTITY"

              # The .p12 is too large for an Azure variable group, so we download it
              # as a secure file and base64 it on the agent.
              if [ -n "$_APPLE_CERTIFICATE_FILE" ] && [ -f "$_APPLE_CERTIFICATE_FILE" ]; then
                apple_cert_b64=$(base64 -i "$_APPLE_CERTIFICATE_FILE" | tr -d '\n')
                exportVars APPLE_CERTIFICATE "$apple_cert_b64"
              else
                exportVars APPLE_CERTIFICATE "$_APPLE_CERTIFICATE"
              fi

              exportVars APPLE_CERTIFICATE_PASSWORD "$_APPLE_CERTIFICATE_PASSWORD"
              exportVars APPLE_API_KEY "$_APPLE_API_KEY"
              exportVars APPLE_API_ISSUER "$_APPLE_API_ISSUER"
              exportVars APPLE_API_KEY_PATH "$_APPLE_API_KEY_PATH"
              exportVars APPLE_ID "$_APPLE_ID"
              exportVars APPLE_PASSWORD "$_APPLE_PASSWORD"
              exportVars APPLE_TEAM_ID "$_APPLE_TEAM_ID"

              pnpm --filter @teamspace-one/desktop run tauri build --target $(TAURI_TARGET) --ci
            env:
              TAURI_SIGNING_PRIVATE_KEY: $(tauriKey.secureFilePath)
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: $(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
              _APPLE_SIGNING_IDENTITY: $(APPLE_SIGNING_IDENTITY)
              _APPLE_CERTIFICATE_FILE: $(appleCertificate.secureFilePath)
              _APPLE_CERTIFICATE_PASSWORD: $(APPLE_CERTIFICATE_PASSWORD)
              _APPLE_API_KEY: $(APPLE_API_KEY)
              _APPLE_API_ISSUER: $(APPLE_API_ISSUER)
              _APPLE_API_KEY_PATH: $(appleApiKey.secureFilePath)
              _APPLE_ID: $(APPLE_ID)
              _APPLE_PASSWORD: $(APPLE_PASSWORD)
              _APPLE_TEAM_ID: $(APPLE_TEAM_ID)
            displayName: 'Build Tauri bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'apps/desktop/src-tauri/target/$(TAURI_TARGET)/release/bundle'
              artifactName: 'bundles-universal-apple-darwin'

      - job: Windows_x86_64
        displayName: 'Windows x86_64'
        pool:
          vmImage: 'windows-latest'
        variables:
          TAURI_TARGET: 'x86_64-pc-windows-msvc'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            inputs:
              key: 'cargo | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: |
                cargo | "$(Agent.OS)" | "$(TAURI_TARGET)"
                cargo | "$(Agent.OS)"
              path: $(CARGO_HOME)
            displayName: 'Cache Cargo registry'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | $(Build.SourcesDirectory)/pnpm-lock.yaml'
              restoreKeys: pnpm | "$(Agent.OS)"
              path: $(PNPM_STORE_DIR)
            displayName: 'Cache pnpm store'

          - task: Cache@2
            inputs:
              key: 'target | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: target | "$(Agent.OS)" | "$(TAURI_TARGET)"
              path: $(Build.SourcesDirectory)/apps/desktop/src-tauri/target
            displayName: 'Cache Rust target'

          - powershell: |
              npm install -g pnpm@$(pnpmVersion)
              pnpm config set store-dir $env:PNPM_STORE_DIR
              rustup target add $env:TAURI_TARGET
            displayName: 'Install pnpm + Rust target'

          - powershell: pnpm install --frozen-lockfile
            displayName: 'Install workspace dependencies'

          - powershell: pnpm --filter @teamspace-one/authorization build
            displayName: 'Build authorization package'

          - powershell: node scripts/bump-version.mjs ci
            workingDirectory: 'apps/desktop'
            env:
              BUILD_BUILDID: $(Build.BuildId)
            displayName: 'Set CI build version'

          - task: DownloadSecureFile@1
            name: tauriKey
            inputs:
              secureFile: 'teamspace-one.key'
            displayName: 'Download updater signing key'

          - powershell: |
              if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY)) {
                Write-Error "TAURI_SIGNING_PRIVATE_KEY secure file not found at $env:TAURI_SIGNING_PRIVATE_KEY. Upload teamspace-one.key to Azure Pipelines > Library > Secure files."
                exit 1
              }
              # Keys generated with `tauri signer generate --ci` use an empty password, but Tauri
              # still needs the env var to be set (even to an empty string) to avoid an interactive
              # prompt. Guard against the literal Azure macro.
              if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -or $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -like '$(*') {
                $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ''
              }
              pnpm --filter @teamspace-one/desktop run tauri build --target $env:TAURI_TARGET --ci
            env:
              TAURI_SIGNING_PRIVATE_KEY: $(tauriKey.secureFilePath)
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: $(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
            displayName: 'Build Tauri bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'apps/desktop/src-tauri/target/$(TAURI_TARGET)/release/bundle'
              artifactName: 'bundles-x86_64-pc-windows-msvc'

  - stage: PublishDownloads
    displayName: 'Publish downloads to GCE'
    dependsOn: BuildDesktop
    condition: succeeded()
    jobs:
      - job: Stage
        displayName: 'Generate manifest + stage downloads'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              path: $(Pipeline.Workspace)/bundles

          - script: |
              set -e
              for d in $(Pipeline.Workspace)/bundles/bundles-*; do
                [ -d "$d" ] || continue
                triple=${d##*bundles-}
                mkdir -p "apps/desktop/src-tauri/target/$triple/release/bundle"
                cp -r "$d/"* "apps/desktop/src-tauri/target/$triple/release/bundle/"
              done
            displayName: 'Collect bundles'

          - script: |
              set -e
              node scripts/bump-version.mjs ci
              node scripts/rename-release.mjs
              node scripts/generate-update-manifest.mjs \
                --base-url https://teamspaceone.in/downloads \
                --root src-tauri/target \
                --copy-to ../web/public/downloads \
                --out ../web/public/downloads/update.json
            workingDirectory: 'apps/desktop'
            env:
              BUILD_BUILDID: $(Build.BuildId)
            displayName: 'Generate updater manifest + stage downloads'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'apps/web/public/downloads'
              artifactName: 'downloads'

      - job: Deploy
        displayName: 'Deploy to GCE web host'
        dependsOn: Stage
        condition: succeeded()
        pool:
          name: gce
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifactName: 'downloads'
              path: $(Pipeline.Workspace)/downloads

          - script: |
              set -e
              rm -rf /tmp/downloads
              mkdir -p /tmp/downloads
              cp -r $(Pipeline.Workspace)/downloads/. /tmp/downloads/

              # Persist in the repo for future image rebuilds
              mkdir -p /opt/teamspace-one/repo/apps/web/public/downloads
              cp -r /tmp/downloads/. /opt/teamspace-one/repo/apps/web/public/downloads/

              # Live-update the running web container without rebuilding the image
              docker cp /tmp/downloads/. teamspace-one-web:/usr/share/nginx/html/downloads/
              docker exec teamspace-one-web nginx -s reload || true

              rm -rf /tmp/downloads
            displayName: 'Deploy to GCE web host'

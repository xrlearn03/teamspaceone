# Azure Pipelines sequential production deployment for Teamspace One.
#
# Builds and verifies backend containers, rebuilds the website without bundled
# downloads, builds signed macOS and Windows desktop releases, then publishes
# the installers and updater manifest to the running website.
#
# Required secure files / pipeline variables:
#   Secure file: teamspace-one.key     # minisign private key (upload in
#                                      # Azure Pipelines > Library > Secure files)
#   Optional variables:
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  # only if the key is password-protected
#     APPLE_SIGNING_IDENTITY             # e.g. "Developer ID Application: ..."
#     APPLE_CERTIFICATE                  # base64 .p12 (optional)
#     APPLE_CERTIFICATE_PASSWORD
#     APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH
#     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID

trigger:
  batch: true
  branches:
    include:
      - main

pr: none

variables:
- group: teamspace-one
- name: nodeVersion
  value: '20.x'
- name: pnpmVersion
  value: '9.15.9'
- name: CARGO_HOME
  value: '$(Pipeline.Workspace)/.cargo'
- name: PNPM_STORE_DIR
  value: '$(Pipeline.Workspace)/.pnpm-store'
- name: deploymentDomain
  value: 'teamspaceone.in'

stages:
  - stage: DeployBackend
    displayName: 'Deploy backend services'
    lockBehavior: sequential
    jobs:
      - deployment: Backend
        displayName: 'Build and start backend containers'
        environment: 'teamspace-one-production'
        pool:
          name: gce
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - script: |
                    set -euo pipefail
                    exec 9>/var/lock/teamspace-one-deploy.lock
                    flock -w 3600 9
                    cp /opt/teamspace-one/repo/.env .env
                    cp /opt/teamspace-one/repo/docker-compose.gce.yml docker-compose.gce.yml
                    if [ -f /opt/teamspace-one/repo/Caddyfile ]; then
                      cp /opt/teamspace-one/repo/Caddyfile Caddyfile
                    fi
                    compose=(docker compose -p repo -f docker-compose.yml -f docker-compose.gce.yml)
                    infrastructure=(postgres redis nats minio jaeger otel-collector)
                    backend=(auth-service organisation-service messaging-service realtime-service projects-service audit-service notification-service sfu meeting-service file-storage-service search-service ai-service hrms-service interview-service api-gateway)
                    health_urls=(http://auth-service:3002/health http://organisation-service:3003/health http://messaging-service:3004/health http://realtime-service:3005/health http://projects-service:3006/health http://audit-service:3007/health http://notification-service:3008/health http://meeting-service:3009/health http://file-storage-service:3010/health http://search-service:3011/health http://ai-service:3012/health http://hrms-service:3013/health http://interview-service:3014/health http://api-gateway:3000/health)
                    "${compose[@]}" config --quiet
                    "${compose[@]}" build --pull base "${backend[@]}"
                    for service in "${infrastructure[@]}" "${backend[@]}"; do
                      container_id=$("${compose[@]}" ps -aq "$service")
                      if [ -n "$container_id" ]; then
                        error=$(docker inspect --format '{{.State.Error}}' "$container_id")
                        if [[ "$error" == *'RWLayer of container'*'is unexpectedly nil'* ]]; then
                          docker rm -f "$container_id"
                        fi
                      fi
                    done
                    "${compose[@]}" up -d "${infrastructure[@]}" "${backend[@]}"
                    docker builder prune -af 2>/dev/null || true
                    deadline=$((SECONDS + 900))
                    while true; do
                      failed=0
                      pending=0
                      for service in "${infrastructure[@]}" "${backend[@]}"; do
                        container_id=$("${compose[@]}" ps -q "$service")
                        if [ -z "$container_id" ]; then
                          failed=1
                          break
                        fi
                        state=$(docker inspect --format '{{.State.Status}}' "$container_id")
                        health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")
                        if [ "$state" = exited ] || [ "$state" = dead ] || [ "$health" = unhealthy ]; then
                          failed=1
                          break
                        fi
                        if [ "$state" != running ] || [ "$health" = starting ]; then
                          pending=1
                        fi
                      done
                      if [ "$failed" -eq 1 ]; then
                        "${compose[@]}" ps
                        "${compose[@]}" logs --tail=100
                        exit 1
                      fi
                      if [ "$pending" -eq 0 ] && docker run --rm --network repo_default alpine:latest sh -c 'for url; do wget -qO- "$url" >/dev/null || exit 1; done' sh "${health_urls[@]}"; then
                        break
                      fi
                      if [ "$SECONDS" -ge "$deadline" ]; then
                        "${compose[@]}" ps
                        "${compose[@]}" logs --tail=100
                        exit 1
                      fi
                      sleep 10
                    done
                  displayName: 'Deploy and verify backend'

  - stage: DeployWeb
    displayName: 'Build and deploy website'
    dependsOn: DeployBackend
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - deployment: Web
        displayName: 'Build and start web container'
        environment: 'teamspace-one-production'
        pool:
          name: gce
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - script: |
                    set -euo pipefail
                    exec 9>/var/lock/teamspace-one-deploy.lock
                    flock -w 3600 9
                    cp /opt/teamspace-one/repo/.env .env
                    cp /opt/teamspace-one/repo/docker-compose.gce.yml docker-compose.gce.yml
                    if [ -f /opt/teamspace-one/repo/Caddyfile ]; then
                      cp /opt/teamspace-one/repo/Caddyfile Caddyfile
                    fi
                    compose=(docker compose -p repo -f docker-compose.yml -f docker-compose.gce.yml)
                    marker=/opt/teamspace-one/.last-download-build
                    previous_build=0
                    if [ -f "$marker" ]; then
                      previous_build=$(cat "$marker")
                    fi
                    if [ "$(Build.BuildId)" -gt "$previous_build" ]; then
                      install -d /data/downloads /opt/teamspace-one/repo/apps/web/public/downloads
                      find /data/downloads -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                      find /opt/teamspace-one/repo/apps/web/public/downloads -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                    fi
                    "${compose[@]}" config --quiet
                    "${compose[@]}" build --pull web
                    "${compose[@]}" up -d web
                    if "${compose[@]}" config --services | grep -qx caddy; then
                      "${compose[@]}" up -d caddy
                    fi
                    deadline=$((SECONDS + 300))
                    until docker run --rm --network repo_default alpine:latest wget -qO- http://web/ >/dev/null; do
                      if [ "$SECONDS" -ge "$deadline" ]; then
                        "${compose[@]}" ps web
                        "${compose[@]}" logs --tail=100 web
                        exit 1
                      fi
                      sleep 5
                    done
                    tar --exclude=.git --exclude=.env --exclude=docker-compose.gce.yml --exclude=Caddyfile --exclude=apps/web/public/downloads -cf - . | tar -xf - -C /opt/teamspace-one/repo
                  displayName: 'Deploy and verify website'

  - stage: DeployDesktopNext
    displayName: 'Build and deploy desktop web app'
    dependsOn: DeployBackend
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - deployment: DesktopNext
        displayName: 'Build and start desktop-next container'
        environment: 'teamspace-one-production'
        pool:
          name: gce
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - script: |
                    set -euo pipefail
                    exec 9>/var/lock/teamspace-one-deploy.lock
                    flock -w 3600 9
                    cp /opt/teamspace-one/repo/.env .env
                    cp /opt/teamspace-one/repo/docker-compose.gce.yml docker-compose.gce.yml
                    if [ -f /opt/teamspace-one/repo/Caddyfile ]; then
                      cp /opt/teamspace-one/repo/Caddyfile Caddyfile
                    fi
                    compose=(docker compose -p repo -f docker-compose.yml -f docker-compose.gce.yml)
                    "${compose[@]}" config --quiet
                    "${compose[@]}" build --pull base desktop-next
                    docker rm -f teamspace-one-desktop-next 2>/dev/null || true
                    "${compose[@]}" up -d desktop-next
                    if "${compose[@]}" config --services | grep -qx caddy; then
                      "${compose[@]}" up -d caddy
                    fi
                    deadline=$((SECONDS + 300))
                    until docker run --rm --network repo_default alpine:latest wget -qO- http://desktop-next:3002/ >/dev/null; do
                      if [ "$SECONDS" -ge "$deadline" ]; then
                        "${compose[@]}" ps desktop-next
                        "${compose[@]}" logs --tail=100 desktop-next
                        exit 1
                      fi
                      sleep 5
                    done
                    tar --exclude=.git --exclude=.env --exclude=docker-compose.gce.yml --exclude=Caddyfile --exclude=apps/web/public/downloads -cf - . | tar -xf - -C /opt/teamspace-one/repo
                  displayName: 'Deploy and verify desktop web app'

  - stage: ConfigureDesktop
    displayName: 'Configure desktop endpoints'
    dependsOn: DeployWeb
    condition: succeeded()
    jobs:
      - job: Configure
        displayName: 'Generate production desktop configuration'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail
              ./infra/gce/update-desktop.sh "$(deploymentDomain)" ""
              destination="$(Build.ArtifactStagingDirectory)/desktop-config"
              mkdir -p "$destination/apps/desktop/src-tauri/capabilities"
              cp apps/desktop/.env.production "$destination/apps/desktop/.env.production"
              cp apps/desktop/src-tauri/capabilities/default.json "$destination/apps/desktop/src-tauri/capabilities/default.json"
            displayName: 'Wire desktop to production'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/desktop-config'
              artifactName: 'desktop-config'

  - stage: BuildDesktop
    displayName: 'Build desktop bundles'
    dependsOn: ConfigureDesktop
    condition: succeeded()
    jobs:
      - job: macOS_universal
        displayName: 'macOS universal'
        pool:
          vmImage: 'macos-latest'
        variables:
          TAURI_TARGET: 'universal-apple-darwin'
        steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifactName: 'desktop-config'
              path: $(Pipeline.Workspace)/desktop-config

          - script: |
              set -euo pipefail
              cp "$(Pipeline.Workspace)/desktop-config/apps/desktop/.env.production" apps/desktop/.env.production
              cp "$(Pipeline.Workspace)/desktop-config/apps/desktop/src-tauri/capabilities/default.json" apps/desktop/src-tauri/capabilities/default.json
            displayName: 'Apply desktop configuration'

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            inputs:
              key: 'cargo | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: |
                cargo | "$(Agent.OS)" | "$(TAURI_TARGET)"
                cargo | "$(Agent.OS)"
              path: $(CARGO_HOME)
            displayName: 'Cache Cargo registry'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | $(Build.SourcesDirectory)/pnpm-lock.yaml'
              restoreKeys: pnpm | "$(Agent.OS)"
              path: $(PNPM_STORE_DIR)
            displayName: 'Cache pnpm store'

          - task: Cache@2
            inputs:
              key: 'target | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: target | "$(Agent.OS)" | "$(TAURI_TARGET)"
              path: $(Build.SourcesDirectory)/apps/desktop/src-tauri/target
            displayName: 'Cache Rust target'

          - script: |
              npm install -g pnpm@$(pnpmVersion)
              pnpm config set store-dir $(PNPM_STORE_DIR)
              rustup target add aarch64-apple-darwin x86_64-apple-darwin
            displayName: 'Install pnpm + Rust targets'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install workspace dependencies'

          - script: pnpm --filter @teamspace-one/authorization build
            displayName: 'Build authorization package'

          - script: node scripts/bump-version.mjs ci
            workingDirectory: 'apps/desktop'
            env:
              BUILD_BUILDID: $(Build.BuildId)
            displayName: 'Set CI build version'

          - task: DownloadSecureFile@1
            name: tauriKey
            inputs:
              secureFile: 'teamspace-one.key'
            displayName: 'Download updater signing key'

          - task: DownloadSecureFile@1
            name: appleCertificate
            inputs:
              secureFile: 'Certificates.p12'
            displayName: 'Download Apple signing certificate'

          - task: DownloadSecureFile@1
            name: appleApiKey
            inputs:
              secureFile: 'AuthKey_M2U388NVSS.p8'
            displayName: 'Download Apple notarization API key'

          - script: |
              set -e
              if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ ! -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
                echo "TAURI_SIGNING_PRIVATE_KEY secure file not found at $TAURI_SIGNING_PRIVATE_KEY. Upload teamspace-one.key to Azure Pipelines > Library > Secure files." >&2
                exit 1
              fi

              # Optional password for the private key. Keys generated with `tauri signer generate --ci`
              # use an empty password, but Tauri still needs the env var to be set (even to an empty
              # string) to avoid an interactive prompt. Guard against the literal Azure macro.
              if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || [ "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:0:1}" = '$' ]; then
                export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
              fi

              # Only expose macOS signing variables to Tauri when they are actually
              # defined. Azure leaves the macro literal (e.g. $(APPLE_CERTIFICATE)) when
              # a variable is missing, and Tauri then tries to base64-decode that literal
              # and fails with "Invalid symbol 36".
              exportVars() {
                local name=$1 raw=$2
                # A valid base64 cert/identity never starts with "$". Azure leaves the
                # macro literal "$(VAR)" when a variable is undefined, so skip those.
                if [ -n "$raw" ] && [ "${raw:0:1}" != '$' ]; then
                  export "$name=$raw"
                fi
              }
              exportVars APPLE_SIGNING_IDENTITY "$_APPLE_SIGNING_IDENTITY"

              # The .p12 is too large for an Azure variable group, so we download it
              # as a secure file and base64 it on the agent.
              if [ -n "$_APPLE_CERTIFICATE_FILE" ] && [ -f "$_APPLE_CERTIFICATE_FILE" ]; then
                apple_cert_b64=$(base64 -i "$_APPLE_CERTIFICATE_FILE" | tr -d '\n')
                exportVars APPLE_CERTIFICATE "$apple_cert_b64"
              else
                exportVars APPLE_CERTIFICATE "$_APPLE_CERTIFICATE"
              fi

              exportVars APPLE_CERTIFICATE_PASSWORD "$_APPLE_CERTIFICATE_PASSWORD"
              exportVars APPLE_API_KEY "$_APPLE_API_KEY"
              exportVars APPLE_API_ISSUER "$_APPLE_API_ISSUER"
              exportVars APPLE_API_KEY_PATH "$_APPLE_API_KEY_PATH"
              exportVars APPLE_ID "$_APPLE_ID"
              exportVars APPLE_PASSWORD "$_APPLE_PASSWORD"
              exportVars APPLE_TEAM_ID "$_APPLE_TEAM_ID"

              pnpm --filter @teamspace-one/desktop run tauri build --target $(TAURI_TARGET) --ci
            env:
              TAURI_SIGNING_PRIVATE_KEY: $(tauriKey.secureFilePath)
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: $(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
              _APPLE_SIGNING_IDENTITY: $(APPLE_SIGNING_IDENTITY)
              _APPLE_CERTIFICATE_FILE: $(appleCertificate.secureFilePath)
              _APPLE_CERTIFICATE_PASSWORD: $(APPLE_CERTIFICATE_PASSWORD)
              _APPLE_API_KEY: $(APPLE_API_KEY)
              _APPLE_API_ISSUER: $(APPLE_API_ISSUER)
              _APPLE_API_KEY_PATH: $(appleApiKey.secureFilePath)
              _APPLE_ID: $(APPLE_ID)
              _APPLE_PASSWORD: $(APPLE_PASSWORD)
              _APPLE_TEAM_ID: $(APPLE_TEAM_ID)
            displayName: 'Build Tauri bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'apps/desktop/src-tauri/target/$(TAURI_TARGET)/release/bundle'
              artifactName: 'bundles-universal-apple-darwin'

      - job: Windows_x86_64
        displayName: 'Windows x86_64'
        pool:
          vmImage: 'windows-latest'
        variables:
          TAURI_TARGET: 'x86_64-pc-windows-msvc'
        steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              artifactName: 'desktop-config'
              path: $(Pipeline.Workspace)/desktop-config

          - powershell: |
              Copy-Item "$(Pipeline.Workspace)/desktop-config/apps/desktop/.env.production" "apps/desktop/.env.production" -Force
              Copy-Item "$(Pipeline.Workspace)/desktop-config/apps/desktop/src-tauri/capabilities/default.json" "apps/desktop/src-tauri/capabilities/default.json" -Force
            displayName: 'Apply desktop configuration'

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            inputs:
              key: 'cargo | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: |
                cargo | "$(Agent.OS)" | "$(TAURI_TARGET)"
                cargo | "$(Agent.OS)"
              path: $(CARGO_HOME)
            displayName: 'Cache Cargo registry'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | $(Build.SourcesDirectory)/pnpm-lock.yaml'
              restoreKeys: pnpm | "$(Agent.OS)"
              path: $(PNPM_STORE_DIR)
            displayName: 'Cache pnpm store'

          - task: Cache@2
            inputs:
              key: 'target | "$(Agent.OS)" | "$(TAURI_TARGET)" | $(Build.SourcesDirectory)/apps/desktop/src-tauri/Cargo.lock'
              restoreKeys: target | "$(Agent.OS)" | "$(TAURI_TARGET)"
              path: $(Build.SourcesDirectory)/apps/desktop/src-tauri/target
            displayName: 'Cache Rust target'

          - powershell: |
              npm install -g pnpm@$(pnpmVersion)
              pnpm config set store-dir $env:PNPM_STORE_DIR
              rustup target add $env:TAURI_TARGET
            displayName: 'Install pnpm + Rust target'

          - powershell: pnpm install --frozen-lockfile
            displayName: 'Install workspace dependencies'

          - powershell: pnpm --filter @teamspace-one/authorization build
            displayName: 'Build authorization package'

          - powershell: node scripts/bump-version.mjs ci
            workingDirectory: 'apps/desktop'
            env:
              BUILD_BUILDID: $(Build.BuildId)
            displayName: 'Set CI build version'

          - task: DownloadSecureFile@1
            name: tauriKey
            inputs:
              secureFile: 'teamspace-one.key'
            displayName: 'Download updater signing key'

          - powershell: |
              if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY)) {
                Write-Error "TAURI_SIGNING_PRIVATE_KEY secure file not found at $env:TAURI_SIGNING_PRIVATE_KEY. Upload teamspace-one.key to Azure Pipelines > Library > Secure files."
                exit 1
              }
              # Keys generated with `tauri signer generate --ci` use an empty password, but Tauri
              # still needs the env var to be set (even to an empty string) to avoid an interactive
              # prompt. Guard against the literal Azure macro.
              if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -or $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -like '$(*') {
                $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ''
              }
              pnpm --filter @teamspace-one/desktop run tauri build --target $env:TAURI_TARGET --ci
            env:
              TAURI_SIGNING_PRIVATE_KEY: $(tauriKey.secureFilePath)
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: $(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
            displayName: 'Build Tauri bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'apps/desktop/src-tauri/target/$(TAURI_TARGET)/release/bundle'
              artifactName: 'bundles-x86_64-pc-windows-msvc'

  - stage: PublishDownloads
    displayName: 'Publish downloads to GCE'
    dependsOn: BuildDesktop
    condition: succeeded()
    lockBehavior: sequential
    jobs:
      - job: Stage
        displayName: 'Generate manifest + stage downloads'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - task: DownloadPipelineArtifact@2
            inputs:
              source: current
              path: $(Pipeline.Workspace)/bundles

          - script: |
              set -e
              for d in $(Pipeline.Workspace)/bundles/bundles-*; do
                [ -d "$d" ] || continue
                triple=${d##*bundles-}
                mkdir -p "apps/desktop/src-tauri/target/$triple/release/bundle"
                cp -r "$d/"* "apps/desktop/src-tauri/target/$triple/release/bundle/"
              done
            displayName: 'Collect bundles'

          - script: |
              set -e
              node scripts/bump-version.mjs ci
              node scripts/rename-release.mjs
              node scripts/generate-update-manifest.mjs \
                --base-url https://teamspaceone.in/downloads \
                --root src-tauri/target \
                --copy-to ../web/public/downloads \
                --out ../web/public/downloads/update.json
            workingDirectory: 'apps/desktop'
            env:
              BUILD_BUILDID: $(Build.BuildId)
            displayName: 'Generate updater manifest + stage downloads'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'apps/web/public/downloads'
              artifactName: 'downloads'

      - deployment: Deploy
        displayName: 'Deploy to GCE web host'
        dependsOn: Stage
        condition: succeeded()
        environment: 'teamspace-one-production'
        pool:
          name: gce
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    source: current
                    artifactName: 'downloads'
                    path: $(Pipeline.Workspace)/downloads

                - script: |
                    set -euo pipefail
                    exec 9>/var/lock/teamspace-one-deploy.lock
                    flock -w 3600 9
                    build_id=$(Build.BuildId)
                    marker=/opt/teamspace-one/.last-download-build
                    staging=$(mktemp -d)
                    trap 'rm -rf "$staging"' EXIT
                    previous_build=0
                    if [ -f "$marker" ]; then
                      previous_build=$(cat "$marker")
                    fi
                    if [ "$build_id" -le "$previous_build" ]; then
                      exit 0
                    fi
                    cp -a "$(Pipeline.Workspace)/downloads"/. "$staging"/
                    install -d /data/downloads /opt/teamspace-one/repo/apps/web/public/downloads
                    cp -a "$staging"/. /data/downloads/
                    cp -a "$staging"/. /opt/teamspace-one/repo/apps/web/public/downloads/
                    docker inspect teamspace-one-web >/dev/null
                    docker exec teamspace-one-web mkdir -p /usr/share/nginx/html/downloads
                    docker cp "$staging"/. teamspace-one-web:/usr/share/nginx/html/downloads/
                    docker exec teamspace-one-web nginx -s reload
                    docker run --rm --network repo_default alpine:latest wget -qO- http://web/downloads/update.json >/dev/null
                    printf '%s\n' "$build_id" > "$marker"
                  displayName: 'Deploy to GCE web host'
